- id: INV-MOBILE_TOOLCHAIN-001
  name: protected_external_registry_only
  category: authorization
  status: confirmed
  scope:
    include:
      - "scripts/quality/mobile-d0-evidence.mts"
    exclude: []
  rule: >
    The D0 mobile evidence resolver accepts tool declarations only from the
    fixed repository-external registry /opt/huoqiu-quality/mobile-d0/toolchain.v1.json;
    the registry and every path component must be root-owned and not writable
    by group or other users. Repository, home, relative, PATH-discovered, and
    otherwise writable declarations are never executable identities.
  formal: >
    accepted(registry) => registry.path ==
    "/opt/huoqiu-quality/mobile-d0/toolchain.v1.json" &&
    immutable_root_chain(registry.path)
  evidence:
    - "scripts/quality/mobile-d0-evidence.mts:465-840"
    - "scripts/quality/test/mobile-d0-evidence.spec.ts:330-850"
  severity: critical
  confirmed_by: "D0 remediation task owner"
  confirmed_at: "2026-08-09"
  test: "scripts/quality/test/mobile-d0-evidence.spec.ts"
  supersedes: null
  notes: >
    Confirmed by the D0 mobile evidence production-path remediation brief.
    There is no checkout-local or per-user fallback.

- id: INV-MOBILE_TOOLCHAIN-002
  name: every_tool_component_is_identity_bound
  category: referential
  status: confirmed
  scope:
    include:
      - "scripts/quality/mobile-d0-evidence.mts"
    exclude: []
  rule: >
    Every launcher, offline-store file, and transitive distribution file for a
    D0 mobile tool has an absolute canonical path, a root-owned
    non-group/world-writable path chain, and an exact lowercase SHA-256 binding.
    The registry path set must exactly equal the recursive on-disk inventory.
    Resolution and every reuse must revalidate inventory, canonical path, uid,
    mode, and digest before and after execution.
  formal: >
    executable(tool) => components(tool).length > 0 &&
    forall(component in components(tool), absolute(component.path) &&
    immutable_root_chain(component.realpath) &&
    sha256(bytes(component.realpath)) == component.sha256) &&
    registry_paths(tool) == protected_tree_files(tool) &&
    identity_unchanged_before_and_after_each_exec(tool)
  evidence:
    - "scripts/quality/mobile-d0-evidence.mts:523-948"
    - "scripts/quality/mobile-d0-evidence.mts:1115-1157"
    - "scripts/quality/mobile-d0-evidence.mts:1468-1480"
  severity: critical
  confirmed_by: "D0 remediation task owner"
  confirmed_at: "2026-08-09"
  test: "scripts/quality/test/mobile-d0-evidence.spec.ts"
  supersedes: null
  notes: >
    The registry itself is trusted only after the same ownership and
    writability checks. The pnpm store is part of the pnpm component closure. A
    version string or lockfile integrity record never substitutes for component
    identity.

- id: INV-MOBILE_TOOLCHAIN-003
  name: unresolved_or_changed_tools_never_verify
  category: authorization
  status: confirmed
  scope:
    include:
      - "scripts/quality/mobile-d0-evidence.mts"
    exclude: []
  rule: >
    A missing registry, missing required tool, malformed declaration, failed
    version contract, component identity mismatch, or identity change before
    reuse can only terminate with D0_MOBILE_NOT_VERIFIED and a summary whose
    verified field is false; none of those states may reach VERIFIED output.
  formal: >
    !all_required_tools_valid_and_stable =>
    result.code == "D0_MOBILE_NOT_VERIFIED" && summary.verified == false
  evidence:
    - "scripts/quality/mobile-d0-evidence.mts:1115-1480"
    - "scripts/quality/test/mobile-d0-evidence.spec.ts:432-850"
    - "scripts/quality/test/mobile-d0-evidence.spec.ts:1400-1535"
  severity: critical
  confirmed_by: "D0 remediation task owner"
  confirmed_at: "2026-08-09"
  test: "scripts/quality/test/mobile-d0-evidence.spec.ts"
  supersedes: null
  notes: >
    The no-network snapshot install, clean-commit requirement, read-only source
    boundary, and existing exact version contracts remain mandatory.

- id: INV-MOBILE_TOOLCHAIN-004
  name: prepared_execution_never_rediscovers_or_resnapshots_source
  category: authorization
  status: confirmed
  scope:
    include:
      - "scripts/quality/mobile-d0-evidence.mts#runPreparedMobileD0Evidence"
    exclude:
      - "scripts/quality/mobile-d0-evidence.mts#runMobileD0Evidence"
  rule: >
    Prepared mobile D0 execution accepts the detached workspace supplied by the
    protected launcher and never invokes Git, archive, checkout, clone, status,
    or another source-snapshot operation.
  formal: >
    prepared_commands(workspace) intersect
    {git, archive, checkout, clone, status, snapshot} == empty_set
  evidence:
    - "docs/quality/mobile-d0-toolchain.md:16-29"
    - "docs/engineering/quality-trust-model.md:81-93"
    - "scripts/quality/mobile-d0-evidence.mts:1134-1359"
  severity: critical
  confirmed_by: "D0 remediation task owner"
  confirmed_at: "2026-08-09"
  test: "scripts/quality/test/mobile-d0-prepared-evidence.spec.ts"
  supersedes: null
  notes: >
    The legacy repository entrypoint remains outside this scope and may retain
    Git discovery for direct diagnostics.

- id: INV-MOBILE_TOOLCHAIN-005
  name: prepared_success_requires_one_exact_flow
  category: boundary
  status: confirmed
  scope:
    include:
      - "scripts/quality/mobile-d0-evidence.mts#runPreparedMobileD0Evidence"
    exclude: []
  rule: >
    Prepared execution returns a raw success report only after every required
    tool version, platform target, native build/install/launch command, and
    Maestro command succeeds; Maestro totals must be exactly passed=1,
    failed=0, and skipped=0, followed by a final identity sweep.
  formal: >
    raw_success => all_commands_exit_zero && target_ready &&
    totals == {passed: 1, failed: 0, skipped: 0} &&
    all_required_tool_identities_unchanged
  evidence:
    - "docs/quality/mobile-d0-toolchain.md:31-47"
    - "scripts/quality/mobile-d0-evidence.mts:1125-1359"
  severity: critical
  confirmed_by: "D0 remediation task owner"
  confirmed_at: "2026-08-09"
  test: "scripts/quality/test/mobile-d0-prepared-evidence.spec.ts"
  supersedes: null
  notes: >
    Malformed, ambiguous, skipped, mixed pass/fail, and false-success Maestro
    output are all terminal failures.

- id: INV-MOBILE_TOOLCHAIN-006
  name: prepared_report_never_self_certifies
  category: authorization
  status: confirmed
  scope:
    include:
      - "scripts/quality/mobile-d0-evidence.mts#runPreparedMobileD0Evidence"
    exclude: []
  rule: >
    A prepared executor result is only a raw report. It cannot assert VERIFIED
    or certification and is acceptable only when the outer root-signed v3
    launcher binds it to the detached source, protected execution image,
    no-network/read-only-source/owned-process-tree profile, and final gate.
  formal: >
    prepared_result.report_type == "mobile-d0-prepared-raw-v1" &&
    prepared_result.verified is undefined && certification_by_inner == false
  evidence:
    - "docs/engineering/quality-trust-model.md:73-93"
    - "docs/engineering/quality-trust-model.md:115-125"
    - "docs/quality/mobile-d0-toolchain.md:41-52"
    - "docs/quality/mobile-d0-toolchain.md:331-355"
    - "scripts/quality/mobile-d0-evidence.mts:1347-1359"
  severity: critical
  confirmed_by: "D0 remediation task owner"
  confirmed_at: "2026-08-09"
  test: "scripts/quality/test/mobile-d0-prepared-evidence.spec.ts"
  supersedes: null
  notes: >
    No environment variable or repository-local wrapper can prove the launcher
    boundary.
