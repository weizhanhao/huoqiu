version: 1

policies:
  crossOwnerForeignKeys: forbidden
  crossOwnerWrites: forbidden
  stableIdReferences: required
  coordinatedTransactions: authority-ports-only

projectionRules:
  search:
    businessAuthority: false
    writesOnly:
      - search_documents
  operations:
    businessAuthority: false
    writesOnly:
      - operations_admin_audit

tables:
  auth_users:
    owner: auth-provider-private
    authority: provider-private
    mutable: false
  auth_sessions:
    owner: auth-provider-private
    authority: provider-private
    mutable: false
  auth_accounts:
    owner: auth-provider-private
    authority: provider-private
    mutable: false
  auth_verifications:
    owner: auth-provider-private
    authority: provider-private
    mutable: false

  identity_users:
    owner: identity
    authority: aggregate
    mutable: true
  identity_profiles:
    owner: identity
    authority: aggregate
    mutable: true

  instruments:
    owner: instrument-reference
    authority: aggregate
    mutable: true
  listings:
    owner: instrument-reference
    authority: aggregate
    mutable: true
  exchanges:
    owner: instrument-reference
    authority: aggregate
    mutable: true
  exchange_calendars:
