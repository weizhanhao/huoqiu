    authority: aggregate
    mutable: true
  market_bars:
    owner: market-data
    authority: append-only
    mutable: false
  market_entitlement_projection:
    owner: market-data
    authority: projection-only
    mutable: true

  content_posts:
    owner: content
    authority: aggregate
    mutable: true
  content_post_revisions:
    owner: content
    authority: append-only
    mutable: false

  social_comments:
    owner: social
    authority: aggregate
    mutable: true
  social_reactions:
    owner: social
    authority: aggregate
    mutable: true
  social_follows:
    owner: social
    authority: aggregate
    mutable: true
  social_bookmarks:
    owner: social
    authority: aggregate
    mutable: true
  social_blocks:
    owner: social
    authority: aggregate
    mutable: true

  moderation_reports:
    owner: moderation
    authority: aggregate
    mutable: true
  moderation_cases:
    owner: moderation
    authority: aggregate
    mutable: true
  moderation_evidence:
    owner: moderation
    authority: append-only
    mutable: false
  moderation_decisions:
    owner: moderation
    authority: append-only
    mutable: false
  moderation_appeals:
    owner: moderation
    authority: aggregate
    mutable: true
  moderation_audit:
    owner: moderation
    authority: audit-only
    mutable: false

  feed_channels:
    owner: feed
    authority: projection-only
    mutable: true
  feed_items:
    owner: feed
    authority: projection-only
    mutable: true
  feed_ranking_snapshots:
    owner: feed
    authority: projection-only
    mutable: false

  watchlists:
    owner: watchlist
    authority: aggregate
    mutable: true
  watchlist_items:
    owner: watchlist
    authority: aggregate
    mutable: true

  notifications:
    owner: notification
    authority: projection-only
    mutable: true
  notification_read_state:
    owner: notification
    authority: aggregate
    mutable: true
  notification_delivery_attempts:
