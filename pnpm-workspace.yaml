packages:
  - apps/*
  - packages/*
  - spikes/auth

minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
trustLockfile: false
blockExoticSubdeps: true

overrides:
  "@nestjs/platform-fastify>find-my-way": 9.7.0

allowBuilds:
  esbuild: true

patchedDependencies:
  image-size@1.2.1: patches/image-size@1.2.1.patch

auditConfig:
  ignoreGhsas:
    - GHSA-w3rx-r6r6-pgpr
    - GHSA-5p2g-fcmc-qvqq
